<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TermsGuard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      width: 350px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: white;
      color: black;
      overflow-x: hidden;
    }

    .container {
      border-radius: 12px;
      margin: 8px;
      padding: 20px;
      min-height: 300px;
    }

    h3 {
      margin: 0 0 16px 0;
      color: black;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    .risk {
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .low {
      background: linear-gradient(135deg, #d4edda, #c3e6cb);
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .medium {
      background: linear-gradient(135deg, #fff3cd, #ffeaa7);
      color: #856404;
      border: 1px solid #ffeaa7;
    }

    .high {
      background: linear-gradient(135deg, #f8d7da, #f5c6cb);
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-weight: 600;
      color: black;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
    }

    .section-title::before {
      content: '📋';
      margin-right: 8px;
      font-size: 16px;
    }

    .section-title.key-points::before {
      content: '✅';
    }

    .section-title.red-flags::before {
      content: '⚠️';
    }

    ul {
      padding-left: 0;
      list-style: none;
    }

    li {
      margin-bottom: 6px;
      padding-left: 20px;
      position: relative;
      line-height: 1.4;
    }

    li::before {
      content: '•';
      color: black;
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    .no-analysis {
      color: #666;
      font-style: italic;
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    #export-buttons {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #333;
    }

    button:active {
      transform: translateY(0);
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #dark-mode-toggle {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: black;
    }

    #search-bar {
      display: none;
      margin-top: 10px;
    }

    #search-input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 60%;
    }

    /* Dark Mode */
    body.dark {
      background: #121212;
      color: #ffffff;
    }

    body.dark .container {
      background: #1e1e1e;
    }

    body.dark h3,
    body.dark .section-title,
    body.dark .history-url,
    body.dark .page-header h4 {
      color: #ffffff;
    }

    body.dark .history-item {
      background: #2a2a2a;
      border-color: #444;
    }

    body.dark .history-item:hover {
      background: #333;
    }

    body.dark #search-input {
      background: #2a2a2a;
      color: #fff;
      border-color: #444;
    }

    body.dark #history-toggle,
    body.dark #clear-history {
      color: #ffffff;
    }

    body.dark .page-header a {
      color: #90caf9;
    }

    .comparison {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .compare-item {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      background: #f9f9f9;
    }

    .compare-item h5 {
      margin: 0 0 4px 0;
      color: black;
    }

    .compare-section {
      margin-bottom: 8px;
    }

    .compare-section strong {
      display: block;
      margin-bottom: 4px;
    }

    /* Dark Mode for Comparison */
    body.dark .compare-item {
      background: #2a2a2a;
      border-color: #444;
    }

    body.dark .compare-item h5 {
      color: #ffffff;
    }

    body.dark .compare-section strong {
      color: #ffffff;
    }

    body.dark .compare-item p {
      color: #cccccc;
    }

    mark {
      background: yellow;
      padding: 2px;
    }

    #history-toggle {
      text-align: center;
      margin-top: 20px;
      cursor: pointer;
      color: black;
      font-size: 14px;
      font-weight: 500;
      text-decoration: underline;
    }

    #history {
      display: none;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid #e0e0e0;
      padding-top: 16px;
    }

    .history-item {
      margin-bottom: 12px;
      padding: 12px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover {
      background: #e0e0e0;
    }

    .history-content {
      flex: 1;
    }

    .delete-history {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      margin-left: 8px;
    }

    .delete-history:hover {
      background: #f5c6cb;
      border-radius: 4px;
    }

    .history-url {
      font-weight: 600;
      font-size: 13px;
      color: black;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .history-date {
      font-size: 11px;
      color: #6c757d;
    }

    .page-header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .page-header h4 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: black;
    }

    .page-header a {
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      word-break: break-all;
    }

    .page-header a:hover {
      text-decoration: underline;
    }

    #history-header {
      display: none;
      text-align: right;
      margin-bottom: 8px;
    }

    #clear-history {
      color: #dc3545;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
    }

    #clear-history:hover {
      color: #c82333;
    }

    .small-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="header">
        <h3>TermsGuard</h3>
        <button id="dark-mode-toggle">🌙</button>
      </div>
      <div id="api-key-banner" style="display:none;margin-bottom:12px;padding:10px;background:#fff3cd;border:1px solid #ffeaa7;border-radius:8px;text-align:center;font-size:13px;color:#856404;">
        <span id="api-key-banner-text"></span>
        <div style="margin-top:8px;"><button id="open-options" class="small-btn">Open Options</button></div>
      </div>
      <div id="content">
        <div class="loading">Loading...</div>
      </div>
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Search in analysis...">
      </div>
      <div id="export-buttons">
        <button id="copy-clipboard">Copy to Clipboard</button>
      </div>
      <div id="history-toggle">View History</div>
      <div id="history-header">
        <span id="clear-history">Clear History</span>
        <button id="compare-mode" class="small-btn">Compare</button>
      </div>
      <div id="history"></div>
    </div>
  <script src="popup.js"></script>
</body>
</html>
